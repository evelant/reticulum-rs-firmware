[package]
name = "xtask"
description = "Project-local build and environment commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
quote = "=1.0.46"
reticulum-rns-rete = { path = "../crates/rns-rete", default-features = false }
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
reticulum-phase1-rx-local-data = { path = "../tools/phase1-rx-local-data" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn = { version = "=2.0.118", features = ["full", "parsing", "printing"] }
tar = "=0.4.46"
