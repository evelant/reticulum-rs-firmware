[package]
name = "reticulum-e290-ble-api"
description = "Host-side physical qualifier for the E290 BLE authenticated device API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[[bin]]
name = "reticulum-e290-ble-api"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
getrandom.workspace = true
hex.workspace = true
rand_core.workspace = true
reticulum-device-api-ble = { path = "../../crates/device-api-ble" }
reticulum-device-client = { path = "../../crates/device-client" }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Direct exact graph pin for axum's optional `ws` dependency.
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
btleplug = "=0.11.8"
futures-util.workspace = true
uuid = "=1.24.0"
