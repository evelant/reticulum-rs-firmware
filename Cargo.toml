[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
allocator-api2 = { version = "=0.3.1", default-features = false }
embassy-executor = { version = "=0.10.0", default-features = false }
embassy-futures = { version = "=0.1.2", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-time = { version = "=0.5.0", default-features = false }
critical-section = { version = "=1.2.0", default-features = false }
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-hal-bus = { version = "=0.3.0", default-features = false, features = ["async"] }
embedded-storage = { version = "=0.3.1", default-features = false }
esp-alloc = "=0.10.0"
esp-backtrace = { version = "=0.19.0", default-features = false }
esp-bootloader-esp-idf = { version = "=0.5.0", default-features = false }
esp-hal = { version = "=1.1.1", default-features = false }
esp-println = { version = "=0.17.0", default-features = false }
esp-storage = { version = "=0.9.0", default-features = false }
# Local source patch over crates.io 0.3.0. Upstream currently constructs both
# CPU0 and CPU1 main-task `*mut [MaybeUninit<u32>]` slices with byte counts as
# element counts, making both fat pointers four times too long. Keep this path
# pin until an equivalent upstream release exists; see the checked vendor
# inventory and exact edits in vendor/esp-rtos-0.3.0/PATCHES.md.
esp-rtos = { path = "vendor/esp-rtos-0.3.0", version = "=0.3.0", default-features = false }
log = "=0.4.27"
# Local source patch over crates.io 3.0.1. The SX126x driver otherwise derives
# every high-power PA command from requested output power, while the Tracker V2
# HIL needs one atomic RNode-compatible PA/OCP override at its fixed 0 dBm
# modem setting plus an opt-in early external-FEM TX preparation hook and
# post-initialization RF-path hook, plus synchronized public-standby state.
# Existing variants and interfaces retain upstream behavior; see the checked
# vendor inventory in vendor/lora-phy-3.0.1/PATCHES.md.
lora-phy = { version = "=3.0.1", default-features = false }
lora-modulation = { version = "=0.1.5", default-features = false }
minicbor = { version = "=2.2.2", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
hex = "=0.4.3"
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serialport = { version = "=4.9.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
static_cell = "=2.1.1"
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

# Rete is not published as a coherent crates.io release. Keep every crate on
# the same reviewed fork revision and never replace these with reference/ path
# deps. The integration history is based on upstream 9bcb7d3e and composes the
# earlier focused validation, transactional owned-Link and endpoint announce
# policy changes with caller-owned DATA preparation, allocation-atomic receipt
# terminals, exact DATA/channel terminal candidates, exact-interface
# forwarding, owned HEADER_2 typed dispatch, and transactional bounded relay
# Link/reverse admission with typed failures, authenticated Link-interface
# binding, Python-compatible Link keepalive/liveness and pending-proof hop
# behavior, and receipt-atomic Channel retries. Fork tag
# firmware-pin-90570ca keeps this exact candidate reachable independently of
# its development branch.
rete-core = { git = "https://github.com/evelant/rete.git", rev = "90570cafc812b3025011cb690ec74a27f287cb3f", default-features = false }
rete-stack = { git = "https://github.com/evelant/rete.git", rev = "90570cafc812b3025011cb690ec74a27f287cb3f", default-features = false }
rete-transport = { git = "https://github.com/evelant/rete.git", rev = "90570cafc812b3025011cb690ec74a27f287cb3f", default-features = false }

[patch.crates-io]
# Force every current and future graph consumer onto the one reviewed local
# SX126x policy patch rather than allowing a second registry copy.
lora-phy = { path = "vendor/lora-phy-3.0.1" }

[profile.dev]
opt-level = "s"

# Leviculum applies these in its own workspace, but dependency workspaces do
# not inherit profile settings. Keep Phase-0 debug/HIL crypto usable.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
