[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
allocator-api2 = { version = "=0.3.1", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
embassy-executor = { version = "=0.10.0", default-features = false }
embassy-futures = { version = "=0.1.2", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
critical-section = { version = "=1.2.0", default-features = false }
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-hal-bus = { version = "=0.3.0", default-features = false, features = ["async"] }
embedded-graphics = { version = "=0.8.2", default-features = false }
embedded-graphics-core = { version = "=0.4.1", default-features = false }
embedded-storage = { version = "=0.3.1", default-features = false }
esp-alloc = "=0.10.0"
esp-backtrace = { version = "=0.19.0", default-features = false }
esp-bootloader-esp-idf = { version = "=0.5.0", default-features = false }
# Pin the coherent esp-rs radio/HAL source graph to one exact reviewed upstream
# revision.
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb", version = "=1.1.0", default-features = false }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb", version = "=1.0.0-beta.0", default-features = false }
esp-println = { version = "=0.17.0", default-features = false }
esp-storage = { version = "=0.9.0", default-features = false }
# Current upstream includes the corrected CPU0 and CPU1 stack-slice element
# counts formerly carried in the local 0.3.0 overlay.
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb", version = "=0.3.0", default-features = false }
log = "=0.4.27"
# Local source patch over crates.io 3.0.1. The SX126x driver otherwise derives
# every high-power PA command from requested output power, while the Tracker V2
# HIL needs one atomic RNode-compatible PA/OCP override at its fixed 0 dBm
# modem setting plus an opt-in early external-FEM TX preparation hook and
# post-initialization RF-path hook, plus synchronized public-standby state and
# terminal SX126x invalid-frame/timeout receive IRQ handling. The patch also
# adds arm-once continuous-RX IRQ draining and an explicit standby/IRQ quiesce
# before CAD or TX so back-to-back physical frames do not cross a rearm gap.
# Existing variants and interfaces retain upstream behavior; see the checked
# vendor inventory in vendor/lora-phy-3.0.1/PATCHES.md.
lora-phy = { version = "=3.0.1", default-features = false }
lora-modulation = { version = "=0.1.5", default-features = false }
minicbor = { version = "=2.2.2", default-features = false }
getrandom = "=0.3.4"
futures-util = { version = "=0.3.33", default-features = false, features = ["async-await", "std"] }
rand_core = { version = "=0.6.4", default-features = false }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["process"] }
hex = "=0.4.3"
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serialport = { version = "=4.9.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
static_cell = "=2.1.1"
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt", "signal", "sync", "time"] }
# Axum's optional WebSocket feature uses this graph edge. Keep the browser
# qualifier on one exact reviewed protocol implementation.
tokio-tungstenite = { version = "=0.29.0", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["no-serde-warnings", "serde-compat"] }
uniffi = { version = "=0.31.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

# Rete is not published as a coherent crates.io release. Keep every declared
# crate on the same reviewed fork revision. The tracked vendor patch below is
# an exact dfcaa36 snapshot with the audited in-place construction API required
# to initialize the full E290 node directly in PSRAM; never use the ignored
# reference/ checkout as a dependency. The integration history is based on
# upstream 9bcb7d3e and composes the
# earlier focused validation, transactional owned-Link and endpoint announce
# policy changes with caller-owned DATA preparation, allocation-atomic receipt
# terminals, exact DATA/channel terminal candidates, exact-interface
# forwarding, owned HEADER_2 typed dispatch, and transactional bounded relay
# Link/reverse admission with typed failures, authenticated Link-interface
# binding, Python-compatible Link keepalive/liveness and pending-proof hop
# behavior, and receipt-atomic Channel retries. The current exact revision is
# on fork branch codex/responder-handshake-reclaim and descends from the tagged
# firmware-pin-90570ca predecessor. It additionally adds ordinary Link-DATA
# receipts, respects the receiving destination's proof policy, and reclaims
# responder Handshakes that time out before authenticated LRRTT. The direct
# request lineage is 338251b (bounded canonical MessagePack values, including
# the `nil` value used by anonymous NomadNet page requests), 354b875
# (prepared/confirmed dispatch authority and timeout only after first real
# dispatch), ba73ee4 (lossless inbound encoded values with their original
# request timestamp), and the current dfcaa36 (phase-agnostic exact
# request-dispatch reclaim keyed by request and Link IDs, reporting whether
# native residue was prepared or confirmed).
# The predecessor tag does not name the current revision.
rete-core = { git = "https://github.com/evelant/rete.git", rev = "dfcaa36b2d45c22d9cba8f0a7eaeb4cf78cabf08", default-features = false }
rete-lxmf-core = { git = "https://github.com/evelant/rete.git", rev = "dfcaa36b2d45c22d9cba8f0a7eaeb4cf78cabf08", default-features = false }
rete-stack = { git = "https://github.com/evelant/rete.git", rev = "dfcaa36b2d45c22d9cba8f0a7eaeb4cf78cabf08", default-features = false }
rete-transport = { git = "https://github.com/evelant/rete.git", rev = "dfcaa36b2d45c22d9cba8f0a7eaeb4cf78cabf08", default-features = false }

[patch.crates-io]
# Keep registry consumers of esp-rs support crates on the same source revision
# as esp-hal/esp-radio, including upstream esp-rtos and its shared platform
# types.
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-config = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-phy = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
esp-sync = { git = "https://github.com/esp-rs/esp-hal.git", rev = "b50efcb0dcd94b58ec337e511891057aa1f2e8fb" }
# Force every current and future graph consumer onto the one reviewed local
# SX126x policy patch rather than allowing a second registry copy.
lora-phy = { path = "vendor/lora-phy-3.0.1" }

[patch."https://github.com/evelant/rete.git"]
# Exact local overlay of the four coherent dfcaa36 crates. PATCHES.md records
# the bounded construction delta; protocol behavior remains at the declared
# reviewed Git revision above until an externally published successor is
# explicitly approved and pinned.
rete-core = { path = "vendor/rete-dfcaa36/crates/rete-core" }
rete-lxmf-core = { path = "vendor/rete-dfcaa36/crates/rete-lxmf-core" }
rete-stack = { path = "vendor/rete-dfcaa36/crates/rete-stack" }
rete-transport = { path = "vendor/rete-dfcaa36/crates/rete-transport" }

[profile.dev]
opt-level = "s"

# Leviculum applies these in its own workspace, but dependency workspaces do
# not inherit profile settings. Keep Phase-0 debug/HIL crypto usable.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
