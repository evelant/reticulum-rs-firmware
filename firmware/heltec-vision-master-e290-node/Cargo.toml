[package]
name = "reticulum-heltec-vision-master-e290-node"
description = "Permanent LoRa-first Reticulum node firmware for the Heltec Vision Master E290"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
autobins = false

[features]
default = []
journal-schema2-dev-reprovision = []

[dependencies]
reticulum-announce-clock = { path = "../../crates/announce-clock", default-features = false }
reticulum-board-heltec-vision-master-e290-radio = { path = "../../crates/board-heltec-vision-master-e290-radio" }
reticulum-device-api = { path = "../../crates/device-api", default-features = false, features = ["experimental-rns-data"] }
reticulum-device-api-adapter = { path = "../../crates/device-api-adapter", default-features = false, features = ["experimental-rns-data"] }
reticulum-device-api-credential-store = { path = "../../crates/device-api-credential-store", default-features = false }
reticulum-device-api-credentials = { path = "../../crates/device-api-credentials", default-features = false }
reticulum-device-api-framing = { path = "../../crates/device-api-framing", default-features = false }
reticulum-device-api-handoff = { path = "../../crates/device-api-handoff", default-features = false }
reticulum-device-api-pairing = { path = "../../crates/device-api-pairing", default-features = false }
reticulum-device-api-pairing-control = { path = "../../crates/device-api-pairing-control", default-features = false }
reticulum-device-api-pairing-policy = { path = "../../crates/device-api-pairing-policy", default-features = false }
reticulum-device-api-session = { path = "../../crates/device-api-session", default-features = false }
reticulum-device-identity-store = { path = "../../crates/device-identity-store", default-features = false }
reticulum-interface-router = { path = "../../crates/interface-router", default-features = false }
reticulum-node-core = { path = "../../crates/node-core", default-features = false }
reticulum-nor-flash-region = { path = "../../crates/nor-flash-region", default-features = false }
reticulum-radio-interface = { path = "../../crates/radio-interface", default-features = false }
reticulum-radio-tx-dispatch = { path = "../../crates/radio-tx-dispatch", default-features = false }
reticulum-storage-actor = { path = "../../crates/storage-actor", default-features = false }
reticulum-storage-journal = { path = "../../crates/storage-journal", default-features = false }
reticulum-storage-model = { path = "../../crates/storage-model", default-features = false }
reticulum-submission-runtime = { path = "../../crates/submission-runtime", default-features = false }
reticulum-tx-supervisor = { path = "../../crates/tx-supervisor", default-features = false }
embassy-sync.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[target.'cfg(target_arch = "xtensa")'.dependencies]
reticulum-radio-lora-phy = { path = "../../crates/radio-lora-phy" }
reticulum-tx-handoff = { path = "../../crates/tx-handoff", default-features = false }

critical-section.workspace = true
embassy-executor = { workspace = true, features = ["log"] }
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["log"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus.workspace = true
esp-alloc = { workspace = true, features = [
    "esp32s3",
    "global-allocator",
    "internal-heap-stats",
] }
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3", "log-04", "validation"] }
esp-hal = { workspace = true, features = [
    "esp32s3",
    "exception-handler",
    "float-save-restore",
    "log-04",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["esp32s3", "log-04", "no-op"] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp32s3",
    "log-04",
] }
embedded-storage.workspace = true
esp-storage = { workspace = true, features = ["esp32s3", "critical-section"] }
log.workspace = true
static_cell.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
embassy-sync.workspace = true
embedded-storage.workspace = true
reticulum-tx-handoff = { path = "../../crates/tx-handoff", default-features = false }
sha2.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "reticulum-heltec-vision-master-e290-node"
path = "src/main.rs"
test = false
bench = false
