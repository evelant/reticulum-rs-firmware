[package]
name = "reticulum-heltec-vision-master-e290-display-hil"
description = "Display-only SSD1680 bring-up image for the Heltec Vision Master E290"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
autobins = false

[dependencies]
reticulum-board-heltec-vision-master-e290 = { path = "../../crates/board-heltec-vision-master-e290" }
reticulum-eink-ssd1680 = { path = "../../crates/eink-ssd1680" }

embassy-executor = { workspace = true, features = ["log"] }
embassy-time = { workspace = true, features = ["log"] }
embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus.workspace = true
esp-alloc = { workspace = true, features = ["internal-heap-stats"] }
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3", "log-04"] }
esp-hal = { workspace = true, features = [
    "esp32s3",
    "exception-handler",
    "float-save-restore",
    "log-04",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["auto", "esp32s3", "log-04"] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp32s3",
    "log-04",
] }
log.workspace = true

[[bin]]
name = "reticulum-heltec-vision-master-e290-display-hil"
path = "src/main.rs"
test = false
bench = false
