[package]
name = "reticulum-e290-firmware"
description = "Standalone multi-transport Reticulum appliance firmware for the Heltec Vision Master E290"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
autobins = false

[features]
default = ["gateway"]
appliance = [
    "display",
    "dep:esp-radio",
    "dep:prns-interfaces-embassy",
    "dep:trouble-host",
    "esp-radio/ble",
    "esp-radio/unstable",
    "esp-rtos/esp-radio",
]
gateway = [
    "appliance",
    "dep:embassy-net",
    "dep:smoltcp",
    "embassy-net/dhcpv4",
    "embassy-net/dns",
    "esp-radio/coex",
    "esp-radio/wifi",
]
display = [
    "dep:embedded-graphics",
    "dep:reticulum-eink-ssd1680",
]

[dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
heapless = { version = "=0.8.0", default-features = false }
personal-rns = { workspace = true, features = ["bluetooth-auto", "embassy-host", "external-alloc", "flash", "log", "lora", "tcp-dns"] }
prns-interfaces-embassy = { workspace = true, optional = true, features = ["bluetooth-auto-trouble", "log"] }
reticulum-appliance-display-model = { path = "../../crates/appliance-display-model", default-features = false }
reticulum-device-api = { path = "../../crates/device-api", default-features = false, features = ["rns-data", "lxmf", "nomad", "network-config"] }
reticulum-eink-ssd1680 = { path = "../../crates/eink-ssd1680", default-features = false, optional = true }
reticulum-lxmf-durable-ingress = { path = "../../crates/lxmf-durable-ingress", default-features = false }
reticulum-lxmf-ingress = { path = "../../crates/lxmf-ingress", default-features = false }
reticulum-lxmf-mailbox-store = { path = "../../crates/lxmf-mailbox-store", default-features = false }
reticulum-lxmf-model = { path = "../../crates/lxmf-model", default-features = false }
reticulum-lxmf-store = { path = "../../crates/lxmf-store", default-features = false }
reticulum-lxmf-wire = { path = "../../crates/lxmf-wire", default-features = false }
reticulum-nomad-protocol = { path = "../../crates/nomad-protocol", default-features = false }
reticulum-network-config-store = { path = "../../crates/network-config-store", default-features = false }
reticulum-nor-flash-region = { path = "../../crates/nor-flash-region", default-features = false }
reticulum-peer-discovery = { path = "../../crates/peer-discovery", default-features = false }
sha2.workspace = true
smoltcp = { version = "=0.13.0", default-features = false, features = ["proto-dns", "proto-ipv4"], optional = true }
embassy-sync.workspace = true
embedded-graphics = { workspace = true, optional = true }
embedded-storage-async.workspace = true
embedded-storage.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[target.'cfg(target_arch = "xtensa")'.dependencies]
# Trouble's public connection-update bound names this upstream trait directly
# rather than re-exporting it from the host prelude.
bt-hci = { version = "=0.8.1", default-features = false }
embassy-executor = { workspace = true, features = ["log"] }
embassy-embedded-hal.workspace = true
embassy-futures.workspace = true
embassy-time = { workspace = true, features = ["log"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus.workspace = true
esp-alloc = { workspace = true, features = [
    "esp32s3",
    "global-allocator",
    "internal-heap-stats",
] }
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3", "log-04", "validation"] }
esp-hal = { workspace = true, features = [
    "esp32s3",
    "exception-handler",
    "float-save-restore",
    "log-04",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = [
    "critical-section",
    "esp32s3",
    "jtag-serial",
    "log-04",
] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp32s3",
    "log-04",
] }
embassy-net = { version = "=0.9.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
    "udp",
], optional = true }
esp-radio = { workspace = true, features = [
    "esp-alloc",
    "esp32s3",
], optional = true }
esp-storage = { workspace = true, features = ["esp32s3", "critical-section", "embedded-storage"] }
esp-sync = { workspace = true, features = ["esp32s3"] }
log.workspace = true
static_cell.workspace = true
trouble-host = { version = "=0.6.0", default-features = false, features = ["default-packet-pool-size-8"], optional = true }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }
embassy-futures.workspace = true
embassy-sync.workspace = true
embedded-storage.workspace = true
reticulum-lxmf-wire = { path = "../../crates/lxmf-wire", default-features = false }

[lib]
path = "src/lib.rs"

[[bin]]
name = "reticulum-e290-firmware"
path = "src/main.rs"
test = false
bench = false
