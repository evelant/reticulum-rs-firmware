[package]
name = "reticulum-heltec-vision-master-e290-qualification"
description = "RF-inert memory and identity qualification image for the Heltec Vision Master E290"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
autobins = false

[dependencies]
allocator-api2 = { workspace = true, features = ["alloc"] }
embedded-storage.workspace = true
esp-alloc = { workspace = true, features = [
    "esp32s3",
    "global-allocator",
    "internal-heap-stats",
] }
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3", "log-04"] }
esp-hal = { workspace = true, features = [
    "esp32s3",
    "exception-handler",
    "float-save-restore",
    "log-04",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["auto", "esp32s3", "log-04"] }
esp-storage = { workspace = true, features = ["esp32s3", "critical-section"] }
log.workspace = true

[[bin]]
name = "reticulum-heltec-vision-master-e290-qualification"
path = "src/main.rs"
test = false
bench = false
