[package]
name = "reticulum-heltec-tracker-v2"
description = "RF-inert Phase-0 compile probe for Heltec Wireless Tracker V2.3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["safe-idle"]
safe-idle = []

[dependencies]
reticulum-board-heltec-tracker-v2 = { path = "../../crates/board-heltec-tracker-v2" }
reticulum-radio-interface = { path = "../../crates/radio-interface" }
reticulum-rns-rete = { path = "../../crates/rns-rete" }

embassy-executor = { workspace = true, features = ["log"] }
embassy-time = { workspace = true, features = ["log"] }
esp-alloc.workspace = true
esp-backtrace = { workspace = true, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32s3", "log-04"] }
esp-hal = { workspace = true, features = [
    "esp32s3",
    "exception-handler",
    "float-save-restore",
    "log-04",
    "rt",
    "unstable",
] }
esp-println = { workspace = true, features = ["auto", "esp32s3", "log-04"] }
esp-rtos = { workspace = true, features = [
    "embassy",
    "esp-alloc",
    "esp32s3",
    "log-04",
] }
log.workspace = true

# Deliberate compile-time integration probe. The safe-idle binary does not
# construct a radio driver or call any lora-phy operation.
lora-phy.workspace = true

[[bin]]
name = "reticulum-heltec-tracker-v2"
path = "src/main.rs"
test = false
bench = false
