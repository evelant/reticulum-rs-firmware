[package]
name = "reticulum-appliance-native"
description = "Native mobile binding surface for the Reticulum appliance client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
log.workspace = true
personal-rns = { workspace = true, features = ["bluetooth-auto", "log", "parallel-persistence", "tokio-host"] }
reticulum-device-api = { path = "../device-api", default-features = false, features = ["lxmf", "nomad", "network-config"] }
reticulum-appliance-sync = { path = "../appliance-sync" }
reticulum-appliance-runtime = { path = "../appliance-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uniffi = { workspace = true, features = ["tokio"] }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
prns-ffi.workspace = true

[dev-dependencies]
reticulum-appliance-store = { path = "../appliance-store" }

[lib]
crate-type = ["lib", "staticlib"]
path = "src/lib.rs"
