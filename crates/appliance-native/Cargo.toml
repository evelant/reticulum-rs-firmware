[package]
name = "reticulum-appliance-native"
description = "Native mobile binding surface for the Reticulum appliance client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
rand_core.workspace = true
reticulum-device-client = { path = "../device-client" }
reticulum-device-api = { path = "../device-api", default-features = false, features = ["experimental-lxmf", "experimental-nomad"] }
reticulum-device-api-ble = { path = "../device-api-ble" }
reticulum-lxmf-chat-app = { path = "../lxmf-chat-app" }
reticulum-lxmf-chat-runtime = { path = "../lxmf-chat-runtime" }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uniffi = { workspace = true, features = ["tokio"] }
zeroize.workspace = true

[dev-dependencies]
reticulum-device-api-framing = { path = "../device-api-framing" }
reticulum-device-api-session = { path = "../device-api-session" }

[lib]
crate-type = ["lib", "staticlib"]
path = "src/lib.rs"
