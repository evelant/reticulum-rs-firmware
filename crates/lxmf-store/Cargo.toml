[package]
name = "reticulum-lxmf-store"
description = "Append-only power-loss-safe NOR store for inbound LXMF messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
embedded-storage.workspace = true
reticulum-lxmf-model = { path = "../lxmf-model", default-features = false }
sha2.workspace = true

[dev-dependencies]
hex.workspace = true
reticulum-lxmf-wire = { path = "../lxmf-wire", default-features = false }
serde.workspace = true
serde_json.workspace = true

[lib]
path = "src/lib.rs"
