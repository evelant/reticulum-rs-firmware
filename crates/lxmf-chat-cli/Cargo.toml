[package]
name = "reticulum-lxmf-chat"
description = "Minimal persistent USB LXMF chat client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reticulum-lxmf-chat"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
hex.workspace = true
rand_core.workspace = true
reticulum-device-api = { path = "../device-api", default-features = false, features = ["experimental-lxmf"] }
reticulum-device-client = { path = "../device-client" }
reticulum-lxmf-chat-core = { path = "../lxmf-chat-core" }
serialport.workspace = true
