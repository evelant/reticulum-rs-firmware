[package]
name = "reticulum-rns-rete"
description = "Rete protocol foundation and Reticulum integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
conformance = []

[dependencies]
reticulum-lxmf-wire = { path = "../lxmf-wire", default-features = false }
rete-core.workspace = true
rete-lxmf-core.workspace = true
rete-stack = { workspace = true, features = ["alloc"] }
rete-transport.workspace = true
rand_core.workspace = true
sha2.workspace = true

[dev-dependencies]
hex.workspace = true
reticulum-radio-interface = { path = "../radio-interface" }
serde.workspace = true
serde_json.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "rns_1_3_8"
path = "tests/rns_1_3_8.rs"
required-features = ["conformance"]
