[package]
name = "reticulum-device-api-adapter"
description = "Authenticated device API adapter for durable Reticulum submissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
experimental-rns-data = ["reticulum-device-api/experimental-rns-data"]

[dependencies]
reticulum-device-api = { path = "../device-api", default-features = false }
reticulum-storage-model = { path = "../storage-model", default-features = false }

[dev-dependencies]
embedded-storage.workspace = true
reticulum-storage-actor = { path = "../storage-actor", default-features = false }

[lib]
path = "src/lib.rs"
