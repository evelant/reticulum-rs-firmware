[package]
name = "reticulum-semantic-roundtrip-hil"
description = "Board-independent bounded Reticulum semantic HIL fixtures and policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
semantic-announce-hil = [
    "dep:rand_core",
    "dep:reticulum-rns-rete",
    "reticulum-rns-rete/conformance",
]
semantic-roundtrip-hil = [
    "dep:rand_core",
    "dep:reticulum-rns-rete",
]

[dependencies]
rand_core = { workspace = true, optional = true }
reticulum-radio-interface = { path = "../radio-interface", default-features = false }
reticulum-rns-rete = { path = "../rns-rete", default-features = false, optional = true }
