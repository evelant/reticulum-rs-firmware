[package]
name = "reticulum-device-api-session"
description = "Bounded authenticated sessions for local Reticulum device-API bearers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hkdf.workspace = true
hmac.workspace = true
rand_core.workspace = true
reticulum-device-api = { path = "../device-api", default-features = false }
reticulum-device-api-credentials = { path = "../device-api-credentials" }
reticulum-device-api-framing = { path = "../device-api-framing" }
reticulum-device-api-handoff = { path = "../device-api-handoff" }
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
reticulum-device-api-adapter = { path = "../device-api-adapter", features = ["rns-data"] }
reticulum-storage-model = { path = "../storage-model" }

[lib]
path = "src/lib.rs"
