[package]
name = "reticulum-board-heltec-vision-master-e290-radio"
description = "Bidirectional HT-RA62/SX1262 owner for the Heltec Vision Master E290"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
lora-phy.workspace = true
reticulum-board-heltec-vision-master-e290 = { path = "../board-heltec-vision-master-e290", default-features = false }
reticulum-radio-interface = { path = "../radio-interface", default-features = false }
reticulum-radio-lora-phy = { path = "../radio-lora-phy", default-features = false }

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[lib]
path = "src/lib.rs"
