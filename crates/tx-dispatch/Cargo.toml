[package]
name = "reticulum-tx-dispatch"
description = "Persistent RF-inert packet dispatcher for Reticulum TX ownership"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
embassy-sync.workspace = true
rand_core.workspace = true
reticulum-node-core = { path = "../node-core", default-features = false }
reticulum-tx-handoff = { path = "../tx-handoff", default-features = false }
sha2.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
reticulum-rns-rete = { path = "../rns-rete", default-features = false }
static_cell.workspace = true

[lib]
path = "src/lib.rs"
