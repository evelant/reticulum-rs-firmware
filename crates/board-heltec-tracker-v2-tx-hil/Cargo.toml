[package]
name = "reticulum-board-heltec-tracker-v2-tx-hil"
description = "Explicitly hazardous bidirectional radio owner for Tracker V2 hardware-in-the-loop tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Forward availability of the diagnostic configuration and explicitly select
# it inside this facade; the calibrated product value remains invariant.
near-field-attenuation-hil = [
    "reticulum-board-heltec-tracker-v2-radio/near-field-attenuation",
]

[dependencies]
reticulum-board-heltec-tracker-v2-radio = { path = "../board-heltec-tracker-v2-radio" }

[lib]
path = "src/lib.rs"
