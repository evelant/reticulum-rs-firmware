[package]
name = "reticulum-appliance-store"
description = "Durable local data model for Reticulum appliance clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { workspace = true, optional = true }

[lib]
path = "src/lib.rs"
