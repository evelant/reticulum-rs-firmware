[package]
name = "reticulum-device-pairing-client"
description = "Transport-neutral pairing session and durable credential state for Reticulum devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
reticulum-device-api-framing = { path = "../device-api-framing", default-features = false }
reticulum-device-api-pairing = { path = "../device-api-pairing", default-features = false }
reticulum-device-api-pairing-control = { path = "../device-api-pairing-control", default-features = false }
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
hex.workspace = true

[lib]
path = "src/lib.rs"
