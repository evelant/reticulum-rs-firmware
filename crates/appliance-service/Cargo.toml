[package]
name = "reticulum-appliance-service"
description = "Host service and generated TypeScript boundary for Reticulum appliances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reticulum-appliance-service"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
reticulum-appliance-native = { path = "../appliance-native" }
reticulum-appliance-runtime = { path = "../appliance-runtime" }
reticulum-device-api = { path = "../device-api", default-features = false, features = ["lxmf", "nomad", "network-config"] }
serde.workspace = true
subtle.workspace = true
tokio.workspace = true
ts-rs.workspace = true

[dev-dependencies]
reticulum-appliance-runtime = { path = "../appliance-runtime", features = ["test-support"] }
serde_json.workspace = true
tower.workspace = true

[lib]
path = "src/lib.rs"
