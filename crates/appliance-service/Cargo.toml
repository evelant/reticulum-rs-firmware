[package]
name = "reticulum-appliance-service"
description = "Host service and generated TypeScript boundary for Reticulum appliances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reticulum-appliance-service"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
rand_core.workspace = true
reticulum-device-api = { path = "../device-api", default-features = false, features = ["lxmf", "nomad", "network-config"] }
reticulum-device-api-ble = { path = "../device-api-ble" }
reticulum-device-client = { path = "../device-client", features = ["network-config"] }
reticulum-host-ble = { path = "../host-ble" }
reticulum-appliance-sync = { path = "../appliance-sync" }
reticulum-appliance-runtime = { path = "../appliance-runtime" }
serde.workspace = true
subtle.workspace = true
tokio.workspace = true
ts-rs.workspace = true

[dev-dependencies]
reticulum-device-api-session = { path = "../device-api-session" }
reticulum-appliance-runtime = { path = "../appliance-runtime", features = ["test-support"] }
serde_json.workspace = true
tower.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lib]
path = "src/lib.rs"
