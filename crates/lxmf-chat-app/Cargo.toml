[package]
name = "reticulum-lxmf-chat-app"
description = "Application services shared by Reticulum LXMF chat clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reticulum-device-api = { path = "../device-api", default-features = false, features = ["experimental-lxmf", "experimental-nomad", "experimental-network-config"] }
reticulum-device-client = { path = "../device-client", features = ["experimental-network-config"] }
reticulum-lxmf-chat-core = { path = "../lxmf-chat-core" }
reticulum-lxmf-wire = { path = "../lxmf-wire", default-features = false }

[lib]
path = "src/lib.rs"
