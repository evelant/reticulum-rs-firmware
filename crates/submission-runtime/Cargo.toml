[package]
name = "reticulum-submission-runtime"
description = "Transport-neutral durable submission coordinator for Reticulum firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
embassy-sync.workspace = true
rand_core.workspace = true
reticulum-node-core = { path = "../node-core", default-features = false }
reticulum-storage-actor = { path = "../storage-actor", default-features = false }
reticulum-storage-model = { path = "../storage-model", default-features = false }
reticulum-submission-projector = { path = "../submission-projector", default-features = false }
reticulum-tx-supervisor = { path = "../tx-supervisor", default-features = false }

[dev-dependencies]
embedded-storage.workspace = true
reticulum-storage-journal = { path = "../storage-journal", default-features = false }

[lib]
path = "src/lib.rs"
