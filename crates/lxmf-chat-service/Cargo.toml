[package]
name = "reticulum-lxmf-chat-service"
description = "USB appliance service and bundled web client for Reticulum LXMF chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reticulum-lxmf-chat-service"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
rand_core.workspace = true
reticulum-device-api = { path = "../device-api", default-features = false, features = ["experimental-lxmf"] }
reticulum-device-client = { path = "../device-client" }
reticulum-device-pairing-client = { path = "../device-pairing-client" }
reticulum-lxmf-chat-app = { path = "../lxmf-chat-app" }
reticulum-lxmf-chat-core = { path = "../lxmf-chat-core" }
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
subtle.workspace = true
tokio.workspace = true
ts-rs.workspace = true

[dev-dependencies]
tower.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lib]
path = "src/lib.rs"
