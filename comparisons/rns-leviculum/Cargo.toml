[package]
name = "reticulum-rns-leviculum"
description = "Isolated AGPL Phase-0 comparison integration for Leviculum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[features]
default = []
compression = ["leviculum-core/compression"]
tracing = ["leviculum-core/tracing"]

[dependencies]
reticulum-rns-conformance = { path = "../../crates/rns-conformance" }
leviculum-core = { git = "https://codeberg.org/Lew_Palm/leviculum.git", rev = "5fb1db0e5e5a490291ee5f6b81312cf0c9de622a", default-features = false }

[lib]
path = "src/lib.rs"
