name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Expo application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/appliance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run verify

  host:
    name: Rust and protocol interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: |
            interop/python/requirements-rns-1.3.8.txt
            interop/python/requirements-lxmf-1.0.1.txt
      - name: Install Python protocol authorities
        run: |
          python -m pip install --disable-pip-version-check \
            --target target/interop/rns-1.3.8 \
            -r interop/python/requirements-rns-1.3.8.txt
          python -m pip install --disable-pip-version-check \
            --target target/interop/lxmf-1.0.1 \
            -r interop/python/requirements-lxmf-1.0.1.txt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Host tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked
      - name: Firmware policy and state-machine tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked -p reticulum-e290-firmware --lib
      - name: RNS 1.3.8 interoperability
        run: >-
          cargo test --locked -p reticulum-rns-rete
          --features conformance --test rns_1_3_8
      - name: Python RNS vector determinism
        env:
          PYTHONPATH: target/interop/rns-1.3.8
        run: python interop/python/generate_rns_vectors.py --check
      - name: Python RNS assertions
        env:
          PYTHONPATH: interop/python:target/interop/rns-1.3.8
        run: python -m unittest -v interop/python/test_rns_vectors.py
      - name: Python LXMF vector determinism
        env:
          PYTHONPATH: target/interop/lxmf-1.0.1
        run: python interop/python/generate_lxmf_1_0_1_vectors.py --check
      - name: Python LXMF assertions
        env:
          PYTHONPATH: interop/python:target/interop/lxmf-1.0.1
        run: python -m unittest -v interop/python/test_lxmf_1_0_1_vectors.py
      - name: Python local API vectors
        env:
          PYTHONPATH: interop/python
        run: |
          python interop/python/generate_device_api_session_vectors.py --check
          python interop/python/generate_device_api_pairing_vectors.py --check
          python -m unittest -v \
            interop/python/test_device_api_session_vectors.py \
            interop/python/test_device_api_pairing_vectors.py
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  firmware:
    name: E290 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned Xtensa toolchain
        shell: bash
        run: |
          set -euo pipefail
          espup="$RUNNER_TEMP/espup-0.16.0"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$espup" \
            https://github.com/esp-rs/espup/releases/download/v0.16.0/espup-x86_64-unknown-linux-gnu
          printf '%s  %s\n' \
            3f7522db440c84e2ff04cfd08c1822f9186c7ee285792591017cd69cf9701766 \
            "$espup" | sha256sum --check --strict
          chmod 0755 "$espup"
          export ESPUP_EXPORT_FILE="$RUNNER_TEMP/export-esp.sh"
          "$espup" install \
            --targets esp32s3 \
            --toolchain-version 1.95.0.0 \
            --skip-version-parse \
            --crosstool-toolchain-version 15.2.0_20250920 \
            --name esp
          # shellcheck disable=SC1090
          source "$ESPUP_EXPORT_FILE"
          printf '%s\n' "$PATH" | tr ':' '\n' >>"$GITHUB_PATH"
          printf 'LIBCLANG_PATH=%s\n' "$LIBCLANG_PATH" >>"$GITHUB_ENV"
          rustc +esp --version
          cargo +esp --version
          xtensa-esp32s3-elf-gcc --version | head -n 1
      - name: Install image packager
        run: cargo install --locked --force --version 4.5.0 espflash
      - name: Build appliance profile and inspect final ELF
        run: cargo run --locked -p xtask -- build --profile appliance
      - name: Strict appliance profile Clippy
        env:
          CARGO_TARGET_DIR: target/e290-appliance
        run: >-
          cargo +esp clippy --locked --release
          -p reticulum-e290-firmware
          --target xtensa-esp32s3-none-elf
          --no-default-features --features appliance -- -D warnings
      - name: Build, inspect, and package gateway profile
        run: cargo run --locked -p xtask -- package --profile gateway
      - name: Strict gateway profile Clippy
        env:
          CARGO_TARGET_DIR: target/e290-gateway
        run: >-
          cargo +esp clippy --locked --release
          -p reticulum-e290-firmware
          --target xtensa-esp32s3-none-elf
          --no-default-features --features gateway -- -D warnings
