            unset RETICULUM_LAB_RX_RESET_JOURNAL_SLOT
            unset RETICULUM_LAB_RX_RESET_JOURNAL_WORD
            cargo +esp clippy "${torn_args[@]}" -- -D warnings
          )

      - name: Prepare and verify public eight-artifact closure bundle
        shell: bash
        env:
          RETICULUM_LAB_RX_FREQUENCY_HZ: "915000000"
          RETICULUM_LAB_RX_SPREADING_FACTOR: "7"
          RETICULUM_LAB_RX_BANDWIDTH_HZ: "125000"
          RETICULUM_LAB_RX_CODING_RATE_DENOMINATOR: "5"
          RETICULUM_LAB_RX_PREAMBLE_SYMBOLS: "18"
          RETICULUM_LAB_RX_EXPLICIT_HEADER: "1"
          RETICULUM_LAB_RX_CRC: "1"
          RETICULUM_LAB_RX_IQ_INVERTED: "0"
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/phase1-rx-closure"
          test ! -e "$bundle"
          # This independently binds the same raw project root tree as the
          # normal/pressure bundle through the production preparation path.
          cargo run --locked -p xtask -- phase1-rx-closure-artifacts prepare \
            --output "$bundle" \
            --journal-corrupt-slot 0 \
            --journal-corrupt-word 4 \
            --journal-torn-write-ordinal 9
          cargo run --locked -p xtask -- phase1-rx-closure-artifacts verify \
            --bundle "$bundle"
