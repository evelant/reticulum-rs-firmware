[target.xtensa-esp32s3-none-elf]
# Flash geometry and partition tables differ across supported boards. Keep
# target compilation shared, but require each board's explicit image/flash
# guide instead of a workspace-wide runner.
# The large Xtensa code model keeps literals reachable after the E290 product
# task grows beyond the default l32r literal range.
rustflags = [
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "code-model=large",
    "-Z",
    "emit-stack-sizes",
]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["alloc", "core"]
