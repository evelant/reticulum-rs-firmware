[target.xtensa-esp32s3-none-elf]
# Flash geometry and partition placement are part of the E290 image contract.
# Keep target compilation here, while packaging and flashing remain explicit
# operations in the firmware guide.
# The large Xtensa code model keeps literals reachable after the E290 product
# task grows beyond the default l32r literal range.
rustflags = [
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "code-model=large",
    "-Z",
    "emit-stack-sizes",
]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["alloc", "core"]
